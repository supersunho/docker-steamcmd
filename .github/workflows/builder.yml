name: Build & Push SteamCMD (Multi-arch)

on:
    # push:
    #   branches: [main]
    #   tags: ['v*']
    workflow_dispatch:
        inputs:
            clear_cache:
                description: "Clear build cache before building"
                required: false
                default: false
                type: boolean
env:
    REGISTRY: ghcr.io
    DOCKERHUB_REPO: ${{ vars.DOCKERHUB_USERNAME }}/steamcmd
    CACHE_VERSION: v1

jobs:
    build-and-push:
        runs-on: ubuntu-24.04
        outputs:
            digest: ${{ steps.docker_build.outputs.digest }}
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3
              with:
                  driver: docker-container
                  use: true
                  install: true
                  platforms: linux/amd64,linux/arm64
                  driver-opts: |
                      network=host
                      image=moby/buildkit:buildx-stable-1

            - name: Authenticate with GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Login to Docker Hub
              uses: docker/login-action@v3
              with:
                  username: ${{ vars.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Build and push multi-architecture image
              id: docker_build
              uses: docker/build-push-action@v5
              with:
                  context: .
                  push: true
                  platforms: linux/amd64,linux/arm64
                  tags: |
                      ${{ env.DOCKERHUB_REPO }}:latest
                      ${{ env.DOCKERHUB_REPO }}:amd64
                      ${{ env.DOCKERHUB_REPO }}:arm64
                      ${{ env.DOCKERHUB_REPO }}:${{ github.sha }}
                      ${{ env.REGISTRY }}/${{ github.repository }}:latest
                      ${{ env.REGISTRY }}/${{ github.repository }}:amd64
                      ${{ env.REGISTRY }}/${{ github.repository }}:arm64
                      ${{ env.REGISTRY }}/${{ github.repository }}:${{ github.sha }}
                  no-cache: ${{ github.event.inputs.clear_cache == 'true' }}
                  cache-from: |
                      type=gha,scope=${{ env.CACHE_VERSION }}-${{ github.event.repository.name }}-amd64
                      type=gha,scope=${{ env.CACHE_VERSION }}-${{ github.event.repository.name }}-arm64
                  cache-to: |
                      type=gha,mode=min,scope=${{ env.CACHE_VERSION }}-${{ github.event.repository.name }}-amd64
                      type=gha,mode=min,scope=${{ env.CACHE_VERSION }}-${{ github.event.repository.name }}-arm64

    create-release:
        needs: build-and-push
        runs-on: ubuntu-24.04

        steps:
            - uses: actions/checkout@v4
            - name: Generate release notes
              run: |
                  cat << 'EOF' > RELEASE_NOTES.md
                  ## SteamCMD Docker image (Multi-arch)

                  This release publishes a **community-maintained** Docker image that runs the
                  official x86_64 SteamCMD client on multiple architectures:
                  - On AMD64: Directly on native platform
                  - On ARM64: Via FEX-Emu

                  It is *not* an official Valve image; see the community reference
                  steamcmd/docker project and Valve's SteamCMD documentation.

                  ### Image tags  
                  - Multi-arch manifest: \`docker.io/${{ vars.DOCKERHUB_USERNAME }}/steamcmd:latest\`
                  - AMD64 only: \`docker.io/${{ vars.DOCKERHUB_USERNAME }}/steamcmd:amd64\`
                  - ARM64 only: \`docker.io/${{ vars.DOCKERHUB_USERNAME }}/steamcmd:arm64\`
                  - Version specific: \`docker.io/${{ vars.DOCKERHUB_USERNAME }}/steamcmd:${{ github.sha }}\`

                  ### Platforms  
                  - linux/amd64
                  - linux/arm64

                  Image digest: **${{ needs.build-and-push.outputs.digest }}**
                  EOF

            # 3) GitHub Release 생성
            - name: Create GitHub Release
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ github.ref_name }}
                  name: SteamCMD Multi-arch ${{ github.ref_name }}
                  body_path: RELEASE_NOTES.md
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    build-summary:
        needs: build-and-push
        runs-on: ubuntu-24.04
        steps:
            - name: Write summary
              run: |
                  {
                    echo "### SteamCMD Docker Image (Multi-arch)"
                    echo ""
                    echo "**Status:** Built & pushed to Docker Hub"
                    echo ""
                    echo "| Item | Value |"
                    echo "|------|-------|"
                    echo "| Multi-arch Image | \`docker.io/${{ vars.DOCKERHUB_USERNAME }}/steamcmd:latest\` |"
                    echo "| AMD64 only | \`docker.io/${{ vars.DOCKERHUB_USERNAME }}/steamcmd:amd64\` |"
                    echo "| ARM64 only | \`docker.io/${{ vars.DOCKERHUB_USERNAME }}/steamcmd:arm64\` |"
                    echo "| Platforms | \`linux/amd64, linux/arm64\` |"
                    echo "| Digest | \`${{ needs.build-and-push.outputs.digest }}\` |"
                    echo ""
                    echo "The container embeds the x86_64 SteamCMD binary and runs it through"
                    echo "native execution on AMD64 and via FEX-Emu on ARM64,"
                    echo "following the community guidelines in **steamcmd/docker**"
                    echo "and Valve's official SteamCMD documentation."
                  } >> "$GITHUB_STEP_SUMMARY"
